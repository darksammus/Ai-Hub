<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private AI Dashboard</title>
  <style>body{color:#fff;background:#121212;height:100vh;margin:0;font-family:system-ui,sans-serif;display:flex}.sidebar{box-sizing:border-box;background:#1e1e1e;border-right:1px solid #333;flex-direction:column;gap:15px;width:260px;padding:20px;display:flex}.main-chat{flex-direction:column;flex:1;height:100%;display:flex}.chat-box{flex-direction:column;flex:1;gap:12px;padding:20px;display:flex;overflow-y:auto}.message{white-space:pre-wrap;border-radius:8px;max-width:75%;padding:12px 16px;line-height:1.5}.user{background:#007acc;align-self:flex-end}.ai{background:#2d2d2d;border:1px solid #444;align-self:flex-start}.input-area{background:#1e1e1e;border-top:1px solid #333;gap:10px;padding:15px;display:flex}input,select{color:#fff;background:#2d2d2d;border:1px solid #444;border-radius:6px;padding:12px;font-size:14px}input[type=text]{flex:1}button{color:#fff;cursor:pointer;background:#007acc;border:none;border-radius:6px;padding:12px 20px;font-weight:700}button:hover{background:#0062a3}label{color:#aaa;text-transform:uppercase;font-size:11px;font-weight:700}</style>
  <script type="module" crossorigin src="/assets/index-D7_dLFz7.js"></script>
</head>
<body>

  <!-- Keys Sidebar -->
  <div class="sidebar">
    <h2>⚙️ Dashboard</h2>
    <hr style="border-color: #333; width: 100%;">
    
    <label for="geminiKey">Gemini API Key</label>
    <input type="password" id="geminiKey" placeholder="Paste Google AI Studio Key...">
    
    <label for="claudeKey">Groq API Key</label>
    <input type="password" id="claudeKey" placeholder="Paste Groq Console Key...">
    <label for="openaiKey">OpenAI API Key</label>
<input type="password" id="openaiKey" placeholder="Paste OpenAI Platform Key...">
    
    <p style="font-size: 11px; color: #666; line-height: 1.3;">Your keys are saved directly into your browser's private storage. They are never sent to a third-party server.</p>
  </div>

  <!-- Chat Hub -->
  <div class="main-chat">
    <div class="chat-box" id="chatBox">
      <div class="message ai">Welcome. Select an AI module below, enter your key in the sidebar, and send a message.</div>
    </div>
    
    <div class="input-area">
      <select id="aiSelector">
        <option value="gemini">Google Gemini 3.8</option>
        <option value="claude">Groq Llama 3.3 (spedec)</option>
        <option value="openai">ChatGPT 6 Astra</option>
      </select>
      <input type="text" id="userInput" placeholder="Type a message to your custom AI hub...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

</body>
</html>
